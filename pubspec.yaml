name: lumina_fortune
description: Lumina Fortune — one tap, a sunlit chain harvest.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  shared_preferences: ^2.5.4
  audioplayers: ^6.5.1
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ui/
    - assets/bg/
    - assets/sprites/
    - assets/sfx/
    - assets/brand/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
